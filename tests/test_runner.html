<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Dental System Unit Test Runner</title>
</head>
<body>
  <div id="test-results">RUNNING</div>
  <script src="../js/storage.js"></script>
  <script>
    const results = [];
    function assert(name, condition) {
      if (condition) {
        results.push({ name: name, status: 'PASS' });
      } else {
        results.push({ name: name, status: 'FAIL' });
      }
    }

    async function runTests() {
      try {
        // Test 1: Thai ID Validation
        assert('Thai ID Checksum: Valid ID 1100400123450', isValidThaiCitizenId('1100400123450') === true);
        assert('Thai ID Checksum: Invalid ID 1100400123456', isValidThaiCitizenId('1100400123456') === false);
        assert('Thai ID Checksum: Incomplete 12 digits', isValidThaiCitizenId('110040012345') === false);

        // Test 2: Storage Initialization & Seed Data
        const st = new DentalStorage();
        const appointments = st.getAppointments();
        assert('Initial Appointments Loaded', appointments.length >= 3);

        const schedule = st.getSchedule();
        assert('Schedule Default Slots Exist', schedule.defaultSlots.length >= 4);

        // Test 3: Closed Date Logic
        const today = new Date();
        const holiday = new Date(today);
        holiday.setDate(today.getDate() + 4);
        const holidayStr = holiday.toISOString().split('T')[0];
        const closedCheck = st.isDateOpen(holidayStr);
        assert('Closed Date correctly recognized as closed', closedCheck.isOpen === false);

        // Test 4: Booking Creation
        const testApt = st.createAppointment({
          date: '2026-11-20',
          slotId: '09:00-10:00',
          slotTime: '09:00 - 10:00',
          patientName: 'ทดสอบ ผู้ป่วยทันตกรรม',
          citizenId: '1100400123450',
          phone: '0812345678',
          symptoms: 'ปวดฟันคุด มีอาการบวม',
          medicalNotes: 'ไม่มีโรคประจำตัว'
        });
        assert('Appointment Created with Valid ID', testApt && testApt.id.startsWith('DEN-'));
        assert('Appointment Saved to List', st.getAppointments().some(a => a.id === testApt.id));

        // Test 5: Search Appointment by ID, Phone & Citizen ID
        const searchRes1 = st.searchAppointments(testApt.id);
        assert('Search by Queue ID Found', searchRes1.length > 0 && searchRes1[0].id === testApt.id);

        const searchRes2 = st.searchAppointments('0812345678');
        assert('Search by Phone Found', searchRes2.length > 0);

        const searchRes3 = st.searchAppointments('1100400123450');
        assert('Search by Citizen ID Found', searchRes3.length > 0);

        // Test 6: Dental Staff Login & Reply System
        assert('Staff Login valid credentials (nurse/1234)', st.loginStaff('nurse', '1234') === true);
        assert('Staff Login invalid credentials fails', st.loginStaff('nurse', 'wrong') === false);

        const updated = st.updateAppointmentReply(testApt.id, {
          message: 'ทันตาภิบาลยืนยันนัดหมาย นำบัตร ปชช. มาด้วยครับ',
          repliedBy: 'ทภ. รัตนา'
        }, 'CONFIRMED');

        assert('Appointment Status Updated to CONFIRMED', updated.status === 'CONFIRMED');
        assert('Reply Message Saved Correctly', updated.reply.message.includes('ทันตาภิบาลยืนยัน'));

        // Test 7: Staff Setting Closed Date dynamically
        st.setDateStatus('2026-11-25', false, 'วันหยุดพิเศษประจำคลินิก');
        assert('Staff dynamically set date closed', st.isDateOpen('2026-11-25').isOpen === false);

        // Reopen date
        st.setDateStatus('2026-11-25', true);
        assert('Staff dynamically reopened date', st.isDateOpen('2026-11-25').isOpen === true);

        // Test 8: Staff Calendar Appointments Retrieval by Date
        const aptsOnDay = st.getAppointmentsForDate(testApt.date);
        assert('Calendar Day Appointments Query returns items', aptsOnDay.length > 0);

        // Test 9: Slot Availability & Booking Calculation
        const slotsForDate = st.getSlotsForDate(testApt.date);
        assert('Slots query returns valid slots array', Array.isArray(slotsForDate) && slotsForDate.length > 0);
        const bookedSlot = slotsForDate.find(s => s.id === testApt.slotId);
        assert('Booked slot reflects appointment count', bookedSlot && bookedSlot.bookedCount >= 1);

        // Test 10: Reset Schedule Slots to Default
        const initialSchedule = getInitialSchedule();
        st.saveDefaultSlots(initialSchedule.defaultSlots);
        const resetSchedule = st.getSchedule();
        assert('Schedule successfully reset to default standard slots', resetSchedule.defaultSlots.length === DEFAULT_SLOTS.length);

        // Test 11: Rule 1 - Past Date Locking (ห้ามจองย้อนหลัง)
        const pastCheck = st.isDateBookableForPatient('2020-01-01');
        assert('Advance Policy: Past date is rejected (PAST_DATE)', pastCheck.isBookable === false && pastCheck.code === 'PAST_DATE');

        // Test 12: Rule 2 - Booking Advance >= 5 Days (ต้องจองล่วงหน้ามากกว่า 5 วัน)
        const dSoon = new Date();
        dSoon.setDate(dSoon.getDate() + 2); // 2 days ahead (< 5 days)
        const soonStr = dSoon.toISOString().split('T')[0];
        const soonCheck = st.isDateBookableForPatient(soonStr);
        assert('Advance Policy: Date within 5 days is rejected (TOO_SOON)', soonCheck.isBookable === false && soonCheck.code === 'TOO_SOON');

        // Test 13: Rule 2 - Advance >= 5 Days is Allowed
        const bookableCheck = st.isDateBookableForPatient('2026-11-20');
        assert('Advance Policy: Date >= 5 days ahead is bookable', bookableCheck.isBookable === true && bookableCheck.code === 'OPEN');

        // Test 14: Rule 3 - Thailand Fixed Public Holiday Auto-Closure
        const holidayCheck = st.isDateBookableForPatient('2026-12-05'); // วันพ่อแห่งชาติ
        assert('Holiday Policy: Fixed public holiday auto-closed (2026-12-05)', holidayCheck.isBookable === false && holidayCheck.isPublicHoliday === true);

        // Test 15: Rule 3 - Thailand Movable Buddhist Holiday Auto-Closure
        const movableCheck = getThaiPublicHoliday('2026-07-29'); // วันอาสาฬหบูชา
        assert('Holiday Policy: Movable Buddhist holiday detected (2026-07-29)', movableCheck && movableCheck.isHoliday === true);

        // Test 16: createAppointment enforces bookability rules
        let createBlocked = false;
        try {
          st.createAppointment({
            date: soonStr,
            slotId: '09:00-10:00',
            slotTime: '09:00 - 10:00',
            patientName: 'ทดสอบ ผู้ป่วย',
            citizenId: '1100400123450',
            phone: '0812345678',
            symptoms: 'ปวดฟัน',
            medicalNotes: ''
          });
        } catch (e) {
          createBlocked = true;
        }
        assert('Advance Policy: createAppointment throws error when date < 5 days', createBlocked === true);

        // Test 17: Admin Role & RBAC Detection
        st.loginStaff('nurse', '1234');
        assert('RBAC: Nurse is NOT recognized as admin', st.isStaffAdmin() === false);

        st.loginStaff('admin', '1234');
        assert('RBAC: Admin is recognized as admin', st.isStaffAdmin() === true);

        // Test 18: Non-Admin blocked from adding staff users
        st.loginStaff('nurse', '1234');
        const blockedAdd = st.addStaffUser({
          username: 'fake_user',
          name: 'ผู้ใช้ปลอม',
          roleType: 'nurse',
          password: 'pass'
        });
        assert('RBAC: Non-admin cannot add new users', blockedAdd.success === false);

        // Test 19: Admin can add new staff user
        st.loginStaff('admin', '1234');
        const addRes = st.addStaffUser({
          username: 'dentist_somchai',
          name: 'ทภ. สมชาย ใจดี',
          role: 'ทันตแพทย์ปฏิบัติการ',
          roleType: 'nurse',
          password: 'initialPass123'
        });
        assert('Admin: Successfully created new staff user', addRes.success === true && addRes.user.username === 'dentist_somchai');
        assert('Admin: User exists in staff list', st.getStaffUsers().some(u => u.username === 'dentist_somchai'));

        // Test 20: Admin can reset forgotten password for user
        const resetRes = st.adminResetPassword('dentist_somchai', 'newResetPass888');
        assert('Admin: Successfully reset password for user', resetRes.success === true);

        // Test 21: User can login with newly reset password
        assert('Admin: User logs in with newly reset password', st.loginStaff('dentist_somchai', 'newResetPass888') === true);

        // Test 22: Admin can delete user
        st.loginStaff('admin', '1234');
        const deleteRes = st.deleteStaffUser('dentist_somchai');
        assert('Admin: Successfully deleted user', deleteRes.success === true);
        assert('Admin: Deleted user no longer in staff list', !st.getStaffUsers().some(u => u.username === 'dentist_somchai'));

        // Test 23: Admin cannot delete own logged-in account
        const deleteSelf = st.deleteStaffUser('admin');
        assert('Admin: Blocked from deleting own logged-in account', deleteSelf.success === false);

        // Format Summary
        const allPassed = results.every(r => r.status === 'PASS');
        document.getElementById('test-results').textContent = JSON.stringify({
          success: allPassed,
          results: results
        });
      } catch (err) {
        document.getElementById('test-results').textContent = JSON.stringify({
          success: false,
          error: err.toString()
        });
      }
    }
    runTests();
  </script>
</body>
</html>
